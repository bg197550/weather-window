name: Check webcams

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/check-webcams.mjs | tee report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: webcam-report
          path: report.txt
