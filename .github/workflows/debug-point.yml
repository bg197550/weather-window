name: Debug NWS point (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="weather-window debug"
          F=$(curl -s -A "$UA" "https://api.weather.gov/points/43.6045,-72.8201" | jq -r .properties.forecast)
          echo "== API"; curl -s -A "$UA" -H "Accept: application/geo+json" "$F" | jq -r '.properties | "upd \(.updateTime) gen \(.generatedAt)", (.periods[] | "\(.name) \(.startTime[5:16]): \(.temperature)")'
          echo "== WEB"; curl -s -A "$UA" "https://forecast.weather.gov/MapClick.php?lat=43.6045&lon=-72.8201&FcstType=json" | jq -r '"issued \(.creationDateLocal)", (range(0;(.time.startPeriodName|length)) as $i | "\(.time.startPeriodName[$i]) \(.time.startValidTime[$i][5:16]): \(.data.temperature[$i])")'
          echo "== GRID maxT/minT"; G=$(curl -s -A "$UA" "https://api.weather.gov/points/43.6045,-72.8201" | jq -r .properties.forecastGridData); curl -s -A "$UA" "$G" | jq -r '.properties | "upd \(.updateTime)", "max: " + ([.maxTemperature.values[] | "\(.validTime[5:13])=\((.value*9/5+32)|round)"]|join(" ")), "min: " + ([.minTemperature.values[] | "\(.validTime[5:13])=\((.value*9/5+32)|round)"]|join(" "))'
