name: Refresh ski area list

on:
  schedule:
    - cron: '41 9 * * 1'  # weekly; ski areas rarely change
  workflow_dispatch:

permissions:
  contents: write

# All data jobs publish to the data branch; run them one at a time so none overwrites another.
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build ski-areas.json from OpenSkiMap
        run: node scripts/update-ski-areas.mjs "$RUNNER_TEMP/ski-areas.json"
      - name: Publish to data branch (single commit, keeps the other data files)
        run: |
          mkdir "$RUNNER_TEMP/data" && cd "$RUNNER_TEMP/data"
          git init -q -b data
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin data && git checkout -q FETCH_HEAD -- . || true
          cp "$RUNNER_TEMP/ski-areas.json" ski-areas.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -q -m "Ski areas $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f origin data
