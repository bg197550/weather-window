<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10283a"><title>Weather Window</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173044;background:#edf3f6}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}a{color:#0b638b}header{background:#10283a;color:#fff;padding:24px max(20px,calc((100vw - 1260px)/2));display:flex;align-items:end;justify-content:space-between;gap:16px}h1{font-size:clamp(25px,3vw,36px);margin:0;font-weight:680;letter-spacing:-.04em}header small{color:#a9c2d0;font-size:14px}nav{background:#10283a;padding:0 max(20px,calc((100vw - 1260px)/2));display:flex;gap:8px;overflow:auto}nav button{border:0;border-bottom:3px solid transparent;background:transparent;color:#b8cbd5;padding:16px 18px;white-space:nowrap;font-weight:650}nav button[aria-selected=true]{color:white;border-color:#57c5df}main{max-width:1300px;margin:auto;padding:28px 20px 70px}h2{margin:0 0 6px;font-size:26px;letter-spacing:-.035em}p{line-height:1.5}.sub{margin:0 0 20px;color:#587084}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}.seg{display:flex;background:#dce8ee;border-radius:12px;padding:4px;gap:3px}.seg button{border:0;background:transparent;border-radius:9px;padding:10px 15px;color:#385368;font-weight:650}.seg button.active{background:#fff;color:#123b53;box-shadow:0 1px 5px #13334820}.outlooks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card,.panel{background:#fff;border:1px solid #d6e3e9;border-radius:16px;box-shadow:0 5px 18px #1a44520a}.outlook{overflow:hidden}.outlook-head{padding:20px 20px 12px}.outlook h3{margin:0 0 4px;font-size:21px}.muted{color:#627c8d;font-size:14px}.map{display:block;width:100%;aspect-ratio:1.15;object-fit:contain;background:#fafcfd}.outlook-foot{padding:12px 20px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}.note{margin:20px 0 0;padding:16px 18px;background:#dcecf2;border-radius:12px;color:#294e61}.forecast-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}.locations{padding:12px;position:sticky;top:16px}.locations h3{margin:8px 10px 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#728a98}.location{display:block;width:100%;text-align:left;padding:11px 12px;background:transparent;border:0;border-radius:9px;color:#29495d;font-weight:600}.location:hover,.location.active{background:#dceef3;color:#075377}.detail{min-width:0}.detail-title{display:flex;align-items:start;justify-content:space-between;gap:14px;margin-bottom:14px}.detail-title h2{margin:0}.refresh{border:1px solid #b8ced9;border-radius:9px;background:white;color:#17445d;padding:9px 13px;font-weight:650}.elevations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.forecast{padding:20px;min-width:0}.forecast h3{margin:0 0 5px;font-size:20px}.current{font-size:40px;line-height:1.1;letter-spacing:-.045em;font-weight:700;margin:16px 0 3px}.condition{min-height:24px;font-weight:580}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.metric{border-top:1px solid #e2ebef;padding-top:10px}.metric span{display:block;color:#728695;font-size:13px}.metric strong{display:block;margin-top:3px;font-size:17px}.periods{border-top:1px solid #e2ebef;padding-top:13px}.period{display:grid;grid-template-columns:94px 1fr 55px;gap:8px;padding:8px 0;border-bottom:1px solid #edf2f4;font-size:14px;align-items:center}.period:last-child{border:0}.period strong:last-child{text-align:right}.source{margin-top:15px;font-size:13px;color:#677f90}.source a{font-weight:600}.error{color:#a04436;background:#fff3ef;padding:14px;border-radius:10px;margin:15px 0}.state{padding:24px;color:#657f8f}.intro{margin:0 0 16px;color:#607c8d}.location-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{padding:18px;text-align:left;border:1px solid #d7e5eb;border-radius:13px;background:white;color:#1b4056}.tile:hover{border-color:#5eaaca}.tile strong{display:block;font-size:18px;margin-bottom:5px}.tile span{color:#647c89;font-size:14px}@media(max-width:900px){.outlooks{grid-template-columns:1fr 1fr}.forecast-layout{grid-template-columns:1fr}.locations{position:static;display:flex;overflow:auto;gap:4px}.locations h3{display:none}.location{width:auto;white-space:nowrap}.elevations{grid-template-columns:1fr}}@media(max-width:650px){header{padding:20px}header small{display:none}nav{padding:0 10px}.outlooks,.location-grid{grid-template-columns:1fr}.map{aspect-ratio:1.35}main{padding:20px 14px 55px}.toolbar{align-items:start}.forecast{padding:17px}.period{grid-template-columns:80px 1fr 45px}}
</style></head><body><header><div><h1>Weather Window</h1><small>NOAA outlooks and local forecasts</small></div><small id="today"></small></header><nav role="tablist" aria-label="Forecast sections"><button role="tab" data-tab="long" aria-selected="true">Long range</button><button role="tab" data-tab="utah" aria-selected="false">Utah forecasts</button><button role="tab" data-tab="ne" aria-selected="false">New England forecasts</button></nav><main id="content"></main><script>
const CPC='https://www.cpc.ncep.noaa.gov/products/predictions/';
const outlooks=[['6–10 days','610day/','610temp.new.gif','610prcp.new.gif','Updated daily'],['8–14 days','814day/','814temp.new.gif','814prcp.new.gif','Updated daily'],['Weeks 3–4','WK34/','gifs/WK34temp.gif','gifs/WK34prcp.gif','Updated Fridays']];
const utah=[{name:'Snyderville',p:[[40.695,-111.536,'Town']]},{name:'Park City',p:[[40.647,-111.498,'Town']]},{name:'Deer Valley',p:[[40.620,-111.485,'Mid mountain · ~8,100 ft'],[40.594,-111.465,'Peak · ~9,570 ft']]},{name:'Canyons Resort',p:[[40.687,-111.572,'Mid mountain · ~8,000 ft'],[40.670,-111.555,'Peak · ~9,990 ft']]},{name:'Alta',p:[[40.588,-111.631,'Mid mountain · ~9,500 ft'],[40.573,-111.639,'Peak · ~10,550 ft']]},{name:'Snowbird',p:[[40.579,-111.657,'Mid mountain · ~9,000 ft'],[40.560,-111.655,'Peak · ~11,000 ft']]},{name:'Solitude',p:[[40.622,-111.592,'Mid mountain · ~8,700 ft'],[40.608,-111.580,'Peak · ~10,480 ft']]},{name:'Brighton',p:[[40.600,-111.582,'Mid mountain · ~9,000 ft'],[40.590,-111.572,'Peak · ~10,500 ft']]},{name:'Snowbasin',p:[[41.206,-111.858,'Mid mountain · ~7,800 ft'],[41.186,-111.840,'Peak · ~9,350 ft']]}];
const ne=[{name:'Boston',p:[[42.361,-71.057,'City']]},{name:'Newport · First Beach',p:[[41.489,-71.272,'Coast']]},{name:'Middletown · Second Beach',p:[[41.487,-71.249,'Coast']]},{name:'Nantasket Beach',p:[[42.273,-70.861,'Coast']]},{name:'Hartford',p:[[41.765,-72.673,'City']]},{name:'Portland, ME',p:[[43.659,-70.257,'City']]}];
let tab='long',field='temp',selection={utah:0,ne:0},cache=new Map();const content=document.querySelector('#content');document.querySelector('#today').textContent=new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric'}).format(new Date());
function render(){document.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));if(tab==='long')longView();else forecastView();}
function longView(){content.innerHTML=`<div class="toolbar"><div><h2>Long range outlook</h2><p class="sub">NOAA Climate Prediction Center · probabilities relative to normal</p></div><div class="seg" aria-label="Outlook variable"><button data-field="temp" class="${field==='temp'?'active':''}">Temperature</button><button data-field="prcp" class="${field==='prcp'?'active':''}">Precipitation</button></div></div><div class="outlooks">${outlooks.map(([title,dir,temp,prcp,update])=>`<article class="card outlook"><div class="outlook-head"><h3>${title}</h3><span class="muted">${update}</span></div><a href="${CPC+dir}" target="_blank" rel="noopener"><img class="map" alt="NOAA ${title} ${field==='temp'?'temperature':'precipitation'} probability outlook" src="${CPC+dir+(field==='temp'?temp:prcp)}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="state" hidden>Map unavailable. Open NOAA outlook ↗</span></a><div class="outlook-foot"><span class="muted">${field==='temp'?'Temperature':'Precipitation'} probability</span><a href="${CPC+dir}" target="_blank" rel="noopener">NOAA outlook ↗</a></div></article>`).join('')}</div><p class="note">Outlook colors show which category is favored, not a specific temperature or snowfall amount. “Equal chances” means no category is clearly favored. The weeks 3–4 precipitation outlook is experimental.</p>`;content.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{field=b.dataset.field;longView()});}
function forecastView(){const places=tab==='utah'?utah:ne,selected=selection[tab],place=places[selected];content.innerHTML=`<div class="toolbar"><div><h2>${tab==='utah'?'Utah forecasts':'New England forecasts'}</h2><p class="sub">National Weather Service · next seven days</p></div></div><div class="forecast-layout"><aside class="card locations" aria-label="Forecast locations"><h3>Locations</h3>${places.map((p,i)=>`<button class="location ${i===selected?'active':''}" data-place="${i}" aria-current="${i===selected?'true':'false'}">${p.name}</button>`).join('')}</aside><section class="detail"><div class="detail-title"><div><h2>${place.name}</h2><p class="intro">${place.p.length===2?'Mid mountain and peak point forecasts':'Local point forecast'}</p></div><button class="refresh" id="refresh">Refresh</button></div><div class="elevations">${place.p.map((p,i)=>`<article class="card forecast" id="forecast-${i}"><h3>${p[2].split(' · ')[0]}</h3><div class="muted">Selected point ${p[2].includes(' · ')?'· '+p[2].split(' · ')[1]:''}</div><div class="state">Loading NWS forecast…</div></article>`).join('')}</div><p class="source">NWS forecasts use a grid of roughly 2.5 km. Closely spaced mountain points may share a grid and show the same forecast. Selected point elevations are approximate; the NWS grid elevation appears on each card.</p></section></div>`;content.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{selection[tab]=+b.dataset.place;forecastView()});content.querySelector('#refresh').onclick=()=>{place.p.forEach(p=>cache.delete(p.slice(0,2).join(',')));forecastView()};place.p.forEach((p,i)=>loadPoint(p,i));}
async function loadPoint(p,i){const el=document.querySelector('#forecast-'+i),key=p.slice(0,2).join(',');try{let data=cache.get(key);if(!data){let point=await getJSON(`https://api.weather.gov/points/${key}`);let url=point.properties.forecast;let fc=await getJSON(url);data={point:point.properties,forecast:fc.properties,url};cache.set(key,data)}if(!el||!el.isConnected)return;let periods=data.forecast.periods||[],first=periods[0],gridFt=data.forecast.elevation?.value!=null?Math.round(data.forecast.elevation.value*3.28084).toLocaleString():null;let forecastLink=`https://forecast.weather.gov/MapClick.php?lat=${p[0]}&lon=${p[1]}`;el.innerHTML=`<h3>${p[2].split(' · ')[0]}</h3><div class="muted">Selected point${p[2].includes(' · ')?' · '+p[2].split(' · ')[1]:''}${gridFt?' · NWS grid '+gridFt+' ft':''}</div><div class="current">${first?.temperature??'–'}°${first?.temperatureUnit??'F'}</div><div class="condition">${escapeHTML(first?.shortForecast||'Forecast unavailable')}</div><div class="metrics"><div class="metric"><span>Wind</span><strong>${escapeHTML(first?.windSpeed||'–')}</strong></div><div class="metric"><span>Direction</span><strong>${escapeHTML(first?.windDirection||'–')}</strong></div><div class="metric"><span>Precip.</span><strong>${first?.probabilityOfPrecipitation?.value!=null?first.probabilityOfPrecipitation.value+'%':'–'}</strong></div></div><div class="periods">${periods.slice(0,7).map(q=>`<div class="period"><strong>${escapeHTML(q.name)}</strong><span>${escapeHTML(q.shortForecast)}</span><strong>${q.temperature}°</strong></div>`).join('')}</div><div class="source">Updated ${new Date(data.forecast.updateTime).toLocaleString()} · <a href="${forecastLink}" target="_blank" rel="noopener">Full NWS forecast ↗</a></div>`}catch(err){if(el&&el.isConnected)el.innerHTML=`<h3>${p[2].split(' · ')[0]}</h3><div class="error">NWS forecast is temporarily unavailable.</div><a href="https://forecast.weather.gov/MapClick.php?lat=${p[0]}&lon=${p[1]}" target="_blank" rel="noopener">Open forecast at weather.gov ↗</a>`}}
async function getJSON(url){let r=await fetch(url,{headers:{Accept:'application/geo+json'}});if(!r.ok)throw Error(r.status);return r.json()}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
