let tab='long',field='temp',selection={utah:0,ne:0},view={utah:'overview',ne:'overview'},cache=new Map(),afdCache=new Map(),modelCache=new Map(),modelElevation={utah:0,ne:0},longRegion='utah',longData=null,longDataTime=0;const content=document.querySelector('#content');document.querySelector('#today').textContent=new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric'}).format(new Date());
function render(){document.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));if(tab==='long')longView();else forecastView();}
function longView(){content.innerHTML=`<div class="toolbar"><div><h2>Long range outlook</h2><p class="sub">NOAA Climate Prediction Center · probabilities relative to normal</p></div><div class="seg" aria-label="Outlook variable"><button data-field="temp" class="${field==='temp'?'active':''}">Temperature</button><button data-field="prcp" class="${field==='prcp'?'active':''}">Precipitation</button></div></div><div class="outlooks">${outlooks.map(([title,dir,temp,prcp,update])=>`<article class="card outlook"><div class="outlook-head"><h3>${title}</h3><span class="muted">${update}</span></div><a href="${CPC+dir}" target="_blank" rel="noopener"><img class="map" alt="NOAA ${title} ${field==='temp'?'temperature':'precipitation'} probability outlook" src="${CPC+dir+(field==='temp'?temp:prcp)}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="state" hidden>Map unavailable. Open NOAA outlook ↗</span></a><div class="outlook-foot"><span class="muted">${field==='temp'?'Temperature':'Precipitation'} probability</span><a href="${CPC+dir}" target="_blank" rel="noopener">NOAA outlook ↗</a></div></article>`).join('')}</div><p class="note">Outlook colors show which category is favored, not a specific temperature or snowfall amount. “Equal chances” means no category is clearly favored. The weeks 3–4 precipitation outlook is experimental.</p><section class="long-brief"><div class="toolbar"><div><h2>What matters in Utah and New England</h2><p class="sub">CPC regional guidance and independent ensemble model scenarios</p></div><div class="seg" aria-label="Long range region"><button data-long-region="utah" class="${longRegion==='utah'?'active':''}">Utah</button><button data-long-region="ne" class="${longRegion==='ne'?'active':''}">New England</button></div></div><div id="long-analysis" class="state">Loading long range analysis…</div></section>`;content.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{field=b.dataset.field;longView()});content.querySelectorAll('[data-long-region]').forEach(b=>b.onclick=()=>{longRegion=b.dataset.longRegion;longView()});loadLongRange();}
async function loadLongRange(){const el=document.querySelector('#long-analysis');try{if(!longData||Date.now()-longDataTime>600000){let u='https://raw.githubusercontent.com/bg197550/weather-window/main/data/long-range.json?t='+Math.floor(Date.now()/600000);try{longData=await getJSON(u)}catch{longData=await getJSON('data/long-range.json?t='+Math.floor(Date.now()/600000))}longDataTime=Date.now()}if(!el||!el.isConnected)return;let d=longData,r=longRegion;el.className='';el.innerHTML=`<p class="muted">${escapeHTML(d.places[r])} model point · data checked ${new Date(d.generatedAt).toLocaleString()} · CPC outlook periods and rolling model-day windows are approximate matches.</p><div class="lr-grid">${d.periods.map((p,i)=>{const g=d.guidance[r][i],m=g.models.filter(x=>x.values),analysis=longModelRead(m,p.name);return `<article class="card lr-card"><h3>${escapeHTML(p.name)}</h3><div class="lr-block"><strong>CPC regional discussion</strong>${p[r].temperature?`<p><b>Temperature:</b> ${escapeHTML(p[r].temperature)}</p>`:''}${p[r].precipitation?`<p><b>Precipitation:</b> ${escapeHTML(p[r].precipitation)}</p>`:''}<a href="${p.source}" target="_blank" rel="noopener">Full CPC discussion ↗</a></div><div class="lr-block"><strong>What the ensemble means differ on</strong><p>${escapeHTML(analysis)}</p><div class="lr-models">${g.models.map(x=>`<div><b>${escapeHTML(x.name)}</b><span>${x.values?`${x.values.temp.toFixed(1)}°F mean · ${x.values.precip.toFixed(2)} in precipitation`:'No data at this lead time'}</span></div>`).join('')}</div></div></article>`}).join('')}</div>${r==='ne'&&d.modelNote?`<p class="note"><strong>CPC model note:</strong> ${escapeHTML(d.modelNote)}</p>`:''}<p class="source">CPC discussion excerpts describe broad areas; use the maps above for the exact boundaries and probabilities. Model values are ensemble means, not normal-temperature departures or the official NOAA outlook. Week 3–4 model differences are especially uncertain. Model data via <a href="https://open-meteo.com/en/docs/ensemble-mean-api" target="_blank" rel="noopener">Open-Meteo ↗</a>.</p>`}catch(err){if(el&&el.isConnected){el.className='error';el.innerHTML='The long range briefing is temporarily unavailable. The NOAA maps and source links above remain available.'}}}
function longModelRead(m,period){if(m.length<2)return 'There are not enough model forecasts to compare this period.';let warm=m.reduce((a,b)=>b.values.temp>a.values.temp?b:a),cool=m.reduce((a,b)=>b.values.temp<a.values.temp?b:a),wet=m.reduce((a,b)=>b.values.precip>a.values.precip?b:a),dry=m.reduce((a,b)=>b.values.precip<a.values.precip?b:a),t=warm.values.temp-cool.values.temp,p=wet.values.precip-dry.values.precip,threshold=period==='Weeks 3–4'?1:.5;let parts=[];parts.push(t>=3?`${warm.name} is warmest and ${cool.name} coolest, ${t.toFixed(1)}°F apart in period-average temperature`:`Temperature means are fairly close (${t.toFixed(1)}°F spread)`);parts.push(p>=threshold?`${wet.name} is wettest and ${dry.name} driest, ${p.toFixed(2)} in apart in period-total precipitation`:`Precipitation totals differ by ${p.toFixed(2)} in`);if(period==='Weeks 3–4')parts.push('ECMWF ENS has no data for the full two-week window; compare GEFS and GEM with low confidence');return parts.join('. ')+'.'}
function forecastView(){const section=tab,places=section==='utah'?utah:ne,selected=selection[section],place=places[selected],mode=view[section];content.innerHTML=`<div class="toolbar"><div><h2>${section==='utah'?'Utah forecasts':'New England forecasts'}</h2><p class="sub">${mode==='afd'?'National Weather Service · complete Area Forecast Discussion':mode==='models'?'GFS, ECMWF and GEM · 10-day guidance':'National Weather Service · next seven days'}</p></div></div><div class="forecast-layout"><aside class="card locations" aria-label="Forecast locations"><h3>Locations</h3>${places.map((p,i)=>`<button class="location ${i===selected?'active':''}" data-place="${i}" aria-current="${i===selected?'true':'false'}">${p.name}</button>`).join('')}</aside><section class="detail"><div class="detail-title"><div><h2>${place.name}</h2><p class="intro">${mode==='afd'?'Full regional discussion from the responsible NWS office':mode==='models'?'Compare model scenarios for this location':place.p.length===2?'Mid mountain and peak point forecasts':'Local point forecast'}</p></div><button class="refresh" id="refresh">Refresh</button></div><div class="forecast-tabs" role="tablist" aria-label="${place.name} forecast views"><button role="tab" data-view="overview" aria-selected="${mode==='overview'}">Overview</button><button role="tab" data-view="discussion" aria-selected="${mode==='discussion'}">Detailed forecast</button><button role="tab" data-view="afd" aria-selected="${mode==='afd'}">Forecast discussion</button><button role="tab" data-view="models" aria-selected="${mode==='models'}">Model comparison</button></div><div class="elevations ${mode!=='overview'?'discussion-mode':''}">${mode==='afd'?'<article class="card afd-card" id="area-discussion"><div class="state">Loading full NWS Area Forecast Discussion…</div></article>':mode==='models'?'<article class="card afd-card" id="model-comparison"><div class="state">Loading model guidance…</div></article>':place.p.map((p,i)=>`<article class="card forecast" id="forecast-${i}"><h3>${p[2].split(' · ')[0]}</h3><div class="muted">Selected point ${p[2].includes(' · ')?'· '+p[2].split(' · ')[1]:''}</div><div class="state">Loading NWS forecast…</div></article>`).join('')}</div>${mode==='afd'||mode==='models'?'':`<p class="source">NWS forecasts use a grid of roughly 2.5 km. Closely spaced mountain points may share a grid and show the same forecast. Selected point elevations are approximate; the NWS grid elevation appears on each card.</p>`}</section></div>`;content.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{selection[section]=+b.dataset.place;forecastView()});content.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view[section]=b.dataset.view;forecastView()});content.querySelector('#refresh').onclick=()=>{place.p.forEach(p=>cache.delete(p.slice(0,2).join(',')));afdCache.clear();modelCache.clear();forecastView()};if(mode==='afd')loadAFD(place.p[0]);else if(mode==='models')loadModels(place,section);else place.p.forEach((p,i)=>loadPoint(p,i,mode));}
async function loadPoint(p,i,mode){const el=document.querySelector('#forecast-'+i),key=p.slice(0,2).join(',');try{let data=cache.get(key);if(!data){let point=await getJSON(`https://api.weather.gov/points/${key}`);let url=point.properties.forecast;let fc=await getJSON(url);data={point:point.properties,forecast:fc.properties,url};cache.set(key,data)}if(!el||!el.isConnected)return;let periods=data.forecast.periods||[],first=periods[0],gridFt=data.forecast.elevation?.value!=null?Math.round(data.forecast.elevation.value*3.28084).toLocaleString():null;let forecastLink=`https://forecast.weather.gov/MapClick.php?lat=${p[0]}&lon=${p[1]}`;let heading=`<h3>${p[2].split(' · ')[0]}</h3><div class="muted">Selected point${p[2].includes(' · ')?' · '+p[2].split(' · ')[1]:''}${gridFt?' · NWS grid '+gridFt+' ft':''}</div>`;let source=`<div class="source">Updated ${new Date(data.forecast.updateTime).toLocaleString()} · <a href="${forecastLink}" target="_blank" rel="noopener">Full NWS forecast ↗</a></div>`;if(mode==='discussion'){el.innerHTML=heading+(periods.length?periods.map(q=>`<section class="discussion-period"><h4>${escapeHTML(q.name)} · ${q.temperature}°${escapeHTML(q.temperatureUnit)} </h4><p>${escapeHTML(q.detailedForecast||q.shortForecast||'No description available.')}</p></section>`).join(''):'<p>No forecast periods available.</p>')+source;return}el.innerHTML=heading+`<div class="current">${first?.temperature??'–'}°${first?.temperatureUnit??'F'}</div><div class="condition">${escapeHTML(first?.shortForecast||'Forecast unavailable')}</div><div class="metrics"><div class="metric"><span>Wind</span><strong>${escapeHTML(first?.windSpeed||'–')}</strong></div><div class="metric"><span>Direction</span><strong>${escapeHTML(first?.windDirection||'–')}</strong></div><div class="metric"><span>Precip.</span><strong>${first?.probabilityOfPrecipitation?.value!=null?first.probabilityOfPrecipitation.value+'%':'–'}</strong></div></div><div class="periods">${periods.slice(0,7).map(q=>`<div class="period"><strong>${escapeHTML(q.name)}</strong><span>${escapeHTML(q.shortForecast)}</span><strong>${q.temperature}°</strong></div>`).join('')}</div>`+source}catch(err){if(el&&el.isConnected)el.innerHTML=`<h3>${p[2].split(' · ')[0]}</h3><div class="error">NWS forecast is temporarily unavailable.</div><a href="https://forecast.weather.gov/MapClick.php?lat=${p[0]}&lon=${p[1]}" target="_blank" rel="noopener">Open forecast at weather.gov ↗</a>`}}
async function loadAFD(p){const el=document.querySelector('#area-discussion');try{const key=p.slice(0,2).join(',');let point=cache.get(key)?.point||(await getJSON(`https://api.weather.gov/points/${key}`)).properties;const code=point.cwa||point.gridId;if(!/^[A-Z]{3}$/.test(code))throw Error('Forecast office unavailable');let entry=afdCache.get(code);if(!entry||Date.now()-entry.time>600000){entry={time:Date.now(),promise:(async()=>{const list=await getJSON(`https://api.weather.gov/products/types/AFD/locations/${code}`);const latest=[...(list['@graph']||[])].sort((a,b)=>Date.parse(b.issuanceTime)-Date.parse(a.issuanceTime))[0];if(!latest?.['@id']?.startsWith('https://api.weather.gov/products/'))throw Error('No discussion found');return getJSON(latest['@id'])})()};afdCache.set(code,entry)}const afd=await entry.promise;if(!el||!el.isConnected)return;const names={SLC:'Salt Lake City',BOX:'Boston/Norton',GYX:'Gray/Portland'};const link=`https://forecast.weather.gov/product.php?site=${code}&issuedby=${code}&product=AFD&format=CI&version=1&glossary=1&highlight=off`;el.innerHTML=`<h3>Area Forecast Discussion · ${escapeHTML(names[code]||code)}</h3><p class="afd-intro">Complete NWS regional discussion. Sections may describe areas beyond this location.</p><div class="muted">Issued ${new Date(afd.issuanceTime).toLocaleString()}</div><pre class="afd-text">${escapeHTML(afd.productText||'Discussion text unavailable.')}</pre><div class="source"><a href="${link}" target="_blank" rel="noopener">Open original NWS discussion ↗</a></div>`}catch(err){if(el&&el.isConnected)el.innerHTML=`<h3>Area Forecast Discussion</h3><div class="error">The NWS discussion is temporarily unavailable.</div><a href="https://www.weather.gov/" target="_blank" rel="noopener">Open weather.gov ↗</a>`}}
const MODELS=[['GFS','gfs_global'],['ECMWF','ecmwf_ifs025'],['GEM','gem_global']];
function modelURL(p,section,id){const u=new URL('https://api.open-meteo.com/v1/forecast');const params={latitude:p[0],longitude:p[1],daily:'temperature_2m_max,precipitation_sum,snowfall_sum',temperature_unit:'fahrenheit',precipitation_unit:'inch',timezone:section==='utah'?'America/Denver':'America/New_York',forecast_days:'10',models:id};Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));return u.toString()}
function modelRows(data,section){const ds=data.map(x=>x.data.daily);const dates=ds[0].time;return dates.map((date,i)=>({date,values:ds.map((d,n)=>({name:data[n].name,high:d.temperature_2m_max?.[i],rain:d.precipitation_sum?.[i],snow:Number.isFinite(d.snowfall_sum?.[i])?(data[n].data.daily_units?.snowfall_sum==='cm'?d.snowfall_sum[i]/2.54:d.snowfall_sum[i]):null}))})).filter(x=>x.values.every(v=>Number.isFinite(v.high)&&Number.isFinite(v.rain)))}
function modelFlags(row,section){const vals=row.values,highs=vals.map(x=>x.high),rains=vals.map(x=>x.rain),snows=vals.map(x=>x.snow).filter(Number.isFinite);let out=[];
 if(Math.max(...rains)-Math.min(...rains)>=.35){let wet=vals.reduce((a,b)=>b.rain>a.rain?b:a),dry=vals.reduce((a,b)=>b.rain<a.rain?b:a);out.push(`${wet.name} is wettest (${wet.rain.toFixed(2)} in) versus ${dry.name} (${dry.rain.toFixed(2)} in)`)}
 if(Math.max(...highs)-Math.min(...highs)>=8)out.push(`high temperatures differ by ${Math.round(Math.max(...highs)-Math.min(...highs))}°F`);
 if(section==='utah'&&snows.length===vals.length&&Math.max(...snows)-Math.min(...snows)>=3)out.push(`snowfall estimates range ${Math.min(...snows).toFixed(1)}–${Math.max(...snows).toFixed(1)} in`);
 return out;
}
async function loadModels(place,section){const el=document.querySelector('#model-comparison'),idx=modelElevation[section]&&place.p[1]?1:0,p=place.p[idx],key=`${p[0]},${p[1]}`;
 try{let entry=modelCache.get(key);if(!entry||Date.now()-entry.time>600000){entry={time:Date.now(),promise:Promise.allSettled(MODELS.map(async([name,id])=>({name,id,data:await getJSON(modelURL(p,section,id))})))};modelCache.set(key,entry)}
 const results=await entry.promise;if(!el||!el.isConnected)return;const data=results.filter(x=>x.status==='fulfilled'&&x.value.data.daily?.time).map(x=>x.value);
 if(data.length<2)throw Error('Insufficient model data');const rows=modelRows(data,section),flagged=rows.map(r=>({row:r,notes:modelFlags(r,section)})).filter(x=>x.notes.length).slice(0,4);
 el.innerHTML=`<h3>Model comparison · ${escapeHTML(place.name)}</h3><p class="afd-intro">Daily model guidance at the selected coordinate. These are independent scenarios, not the official NWS forecast.</p>${place.p.length>1?`<div class="model-switch" aria-label="Model point"><button data-model-point="0" class="${idx===0?'active':''}">Mid mountain</button><button data-model-point="1" class="${idx===1?'active':''}">Peak</button></div>`:''}<div class="muted">${escapeHTML(p[2])} · next ${rows.length} days · ${data.map(x=>x.name).join(', ')}${data.length<3?' (one model unavailable)':''}</div><h3 style="margin-top:24px">Differences to watch</h3><div class="model-highlights">${flagged.length?flagged.map(({row,notes})=>`<div class="model-highlight"><strong>${escapeHTML(dateLabel(row.date))}</strong> · ${escapeHTML(notes.join('; '))}</div>`).join(''):'<p>No large day-by-day differences cross the comparison thresholds right now.</p>'}</div><div class="model-table-wrap"><table class="model-table"><thead><tr><th>Day</th>${data.map(x=>`<th>${escapeHTML(x.name)}<small>High / precip.${section==='utah'?' / snow':''}</small></th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${modelFlags(r,section).length?'flag':''}"><th>${escapeHTML(dateLabel(r.date))}</th>${r.values.map(v=>`<td data-label="${escapeHTML(v.name)}">${Math.round(v.high)}°F / ${v.rain.toFixed(2)} in${section==='utah'&&Number.isFinite(v.snow)?`<small>${v.snow.toFixed(1)} in snow</small>`:''}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="source">Precipitation is liquid equivalent; snow is model-estimated depth. Terrain and model grid elevation can differ from the selected mountain elevation. Highlight thresholds: 8°F high-temperature spread, 0.35 in daily precipitation spread, or 3 in snow spread. Compare timing and trend; avoid treating one model as certain. Data: <a href="https://open-meteo.com/en/docs" target="_blank" rel="noopener">Open-Meteo model API ↗</a>. Official baseline: <a href="https://forecast.weather.gov/MapClick.php?lat=${p[0]}&lon=${p[1]}" target="_blank" rel="noopener">NWS point forecast ↗</a>.</p>`;
 el.querySelectorAll('[data-model-point]').forEach(b=>b.onclick=()=>{modelElevation[section]=+b.dataset.modelPoint;forecastView()})
 }catch(err){if(el&&el.isConnected)el.innerHTML=`<h3>Model comparison</h3><div class="error">Live model guidance is temporarily unavailable. The official NWS forecast remains in Overview.</div><a href="https://open-meteo.com/en/docs" target="_blank" rel="noopener">Open model source ↗</a>`}}
function dateLabel(date){return new Date(`${date}T12:00:00`).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
async function getJSON(url){let r=await fetch(url,{headers:{Accept:url.startsWith('https://api.weather.gov')?'application/geo+json':'application/json'}});if(!r.ok)throw Error(r.status);return r.json()}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
