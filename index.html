  const days=res.reduce((a,b)=>b.time.length>a.length?b.time:a,[]);
  const series=res.map(m=>{let t=0,end=-1;m.snow.forEach((v,i)=>{if(Number.isFinite(v))end=i});return {name:m.name,values:days.map((d,i)=>i<=end&&Number.isFinite(m.snow[i])?(t+=m.snow[i]):null),end}});
  const labels=days.map(d=>new Date(`${d}T12:00:00`).toLocaleDateString('en-US',{weekday:'short',day:'numeric'}));
  const tot=(sr,n)=>sr.end>=n-1?sr.values[n-1]:null,f=v=>v==null?'–':v<.05?'0':v.toFixed(1);
  el.innerHTML=`<h3>Long-range snowfall models · ${escapeHTML(r.name)} peak</h3><p class="afd-intro">Accumulated snowfall from four global models at ${escapeHTML(p[2])}. GFS runs 16 days; ECMWF, AIFS (ECMWF's AI model) and GraphCast (Google DeepMind's AI model) run about 10. Use for trend and agreement, not exact totals.</p><div class="day-pills" aria-label="Resort">${resorts.map((x,i)=>`<button data-snow-resort="${i}" class="${i===snowModelResort?'active':''}">${escapeHTML(x.name)}</button>`).join('')}</div>${makePlot(series.map(x=>({name:x.name,values:x.values})),labels,' in','line',0)}<div class="model-table-wrap"><table class="model-table"><thead><tr><th>Model</th><th>3 days</th><th>7 days</th><th>10 days</th><th>16 days</th></tr></thead><tbody>${series.map(x=>`<tr><th>${escapeHTML(x.name)}</th><td data-label="3 days">${f(tot(x,3))} in</td><td data-label="7 days">${f(tot(x,7))} in</td><td data-label="10 days">${f(tot(x,10))} in</td><td data-label="16 days">${tot(x,16)==null?'–':f(tot(x,16))+' in'}</td></tr>`).join('')}</tbody></table></div><p class="source">Model snowfall is estimated depth from Open-Meteo; models that don't reach a horizon show –. ${SNOW_MODELS.length-res.length?`${SNOW_MODELS.length-res.length} model(s) unavailable right now. `:''}Data: <a href="https://open-meteo.com/en/docs" target="_blank" rel="noopener">Open-Meteo ↗</a>.</p>`;
  el.querySelectorAll('[data-snow-resort]').forEach(b=>b.onclick=()=>{snowModelResort=+b.dataset.snowResort;el.innerHTML='<div class="state">Loading long-range snowfall models…</div>';loadSnowModels()})
 }catch{if(el.isConnected)el.innerHTML='<h3>Long-range snowfall models</h3><div class="error">Model snowfall is temporarily unavailable.</div>'}}
// Context for the shared "Ask AI" panel (suite.js): what's on screen, as text.
window.suiteContext=function(){const names={glance:'At a glance',utah:'Utah forecasts',ne:'New England forecasts',radar:'Radar',long:'Long range outlook'};let label=names[tab]||tab;
 if(tab==='utah'||tab==='ne'){const list=tab==='utah'?utah:ne,mode=view[tab],idx=mode==='mountain'?profileResort+2:selection[tab];label+=` · ${mode==='snow'?'all resorts':list[idx]?.name||''} · ${mode}`}
 return {app:'Weather Window',view:label,text:content.innerText.trim(),note:'Forecasts are from the National Weather Service unless labeled as model guidance; "observed" readings are measured at the named station. Utah times are Mountain, New England times are Eastern.'}};
async function getJSON(url){let r=await fetch(url,{headers:{Accept:url.startsWith('https://api.weather.gov')?'application/geo+json':'application/json'}});if(!r.ok)throw Error(r.status);return r.json()}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('nav [role=tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});readHash();render();refreshAllAlerts();stampHeader();
