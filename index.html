async function mountainPoint(p){const key=p.slice(0,2).join(',');let entry=mountainCache.get(key);if(entry&&Date.now()-entry.time<600000)return entry.promise;const promise=(async()=>{let d=cache.get(key);if(!d){let point=(await getJSON(`https://api.weather.gov/points/${key}`)).properties,fc=(await getJSON(point.forecast)).properties;d={point,forecast:fc};cache.set(key,d)}let grid=(await getJSON(d.point.forecastGridData)).properties;return {point:d.point,forecast:d.forecast,grid,label:p[2]}})();mountainCache.set(key,{time:Date.now(),promise});return promise}
async function loadMountain(place){const el=document.querySelector('#mountain-profile');try{const result=await Promise.all(place.p.map(mountainPoint));if(!el||!el.isConnected)return;renderMountain(el,place,result)}catch(err){if(el&&el.isConnected)el.innerHTML='<h3>Mountain profile</h3><div class="error">NWS mountain grid data is temporarily unavailable. Select Overview for the point forecast.</div>'}}
function renderMountain(el,place,result){const rows=result.map((d,j)=>({name:j?'Peak':'Mid mountain',gridFt:d.forecast.elevation?.value!=null?Math.round(d.forecast.elevation.value*3.28084):null,periods:d.forecast.periods.slice(0,6).map(q=>({name:q.name,temp:q.temperature,wind:parseInt(q.windSpeed,10)||0,snow:periodSnow(d.grid.snowfallAmount?.values,Date.parse(q.startTime),Date.parse(q.endTime))})),gridId:d.point.forecastGridData}));const metric=profileMetric,day=Math.min(profileDay,...rows.map(x=>x.periods.length-1));profileDay=day;const n=Math.min(...rows.map(x=>x.periods.length));const labels=rows[0].periods.slice(0,n).map(x=>x.name.length>10?x.name.slice(0,9)+'…':x.name);let series=rows.map(x=>({name:x.name,values:x.periods.slice(0,n).map(q=>q[metric])}));const noSnow=metric==='snow'&&series.some(x=>x.values.some(v=>v==null));el.innerHTML=`<h3>${escapeHTML(place.name)} · mid mountain and peak</h3><p class="afd-intro">Select a resort on the left, then tap a metric or forecast period. NWS gridded snowfall is summed over each day/night period.</p><div class="chart-controls"><div class="seg">${[['temp','Temperature'],['wind','Wind'],['snow','Snow']].map(([id,label])=>`<button data-mountain-metric="${id}" class="${metric===id?'active':''}">${label}</button>`).join('')}</div></div>${!noSnow&&n?makePlot(series,labels,metric==='temp'?'°F':metric==='wind'?' mph':' in',metric==='snow'?'bar':'line',day):'<div class="note">Snow grid values are unavailable for one of these points.</div>'}<div class="day-pills" aria-label="Select forecast period">${labels.map((label,i)=>`<button data-mountain-day="${i}" class="${i===day?'active':''}">${escapeHTML(label)}</button>`).join('')}</div><div class="mountain-cards">${rows.map(x=>`<div><h4>${escapeHTML(x.name)} · ${escapeHTML(x.gridFt?x.gridFt.toLocaleString()+' ft NWS grid':'grid elevation unavailable')}</h4><p>${escapeHTML(x.periods[day]?.name||'')} · <b>${x.periods[day]?.temp??'–'}°F</b> · wind ${x.periods[day]?.wind??'–'} mph · grid snow ${x.periods[day]?.snow!=null?x.periods[day].snow.toFixed(1)+' in':'unavailable'}</p><small>Selected point: ${escapeHTML(x.name==='Peak'?place.p[1][2]:place.p[0][2])}</small></div>`).join('')}</div><p class="source">${rows[0].gridId===rows[1].gridId?'Both selected points share the same NWS forecast grid, so their gridded forecast may be identical. ':''}Grid elevation can differ from actual mountain elevation. Snow values are NWS gridded snow amount estimates, not resort measurements. <a href="https://www.weather.gov/documentation/services-web-api" target="_blank" rel="noopener">NWS API ↗</a></p>`;el.querySelectorAll('[data-mountain-metric]').forEach(b=>b.onclick=()=>{profileMetric=b.dataset.mountainMetric;renderMountain(el,place,result)});el.querySelectorAll('[data-mountain-day]').forEach(b=>b.onclick=()=>{profileDay=+b.dataset.mountainDay;renderMountain(el,place,result)})}
async function getJSON(url){let r=await fetch(url,{headers:{Accept:url.startsWith('https://api.weather.gov')?'application/geo+json':'application/json'}});if(!r.ok)throw Error(r.status);return r.json()}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
