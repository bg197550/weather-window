function snowpackHTML(d){if(!d)return '<div class="state">Loading SNOTEL…</div>';if(d.error)return '<div class="error">SNOTEL data is temporarily unavailable.</div>';
 const age=Math.round((Date.now()-Date.parse(d.generatedAt))/60000);
 return `<div class="model-table-wrap"><table class="model-table snow-table"><thead><tr><th>Station</th><th>Snow depth<small>latest</small></th><th>Change<small>24 h / 7 days</small></th><th>Water in snow<small>SWE</small></th><th>Air temp</th><th>Last 8 days</th></tr></thead><tbody>${d.stations.map(s=>`<tr><th>${escapeHTML(s.name||s.triplet)}<small>${escapeHTML(s.near)}</small></th><td data-label="Depth"><span><b>${f1(s.latest?.depth)} in</b><small>${escapeHTML(s.latest?.time||'')}</small></span></td><td data-label="Change"><span>${s.change24==null?'–':(s.change24>0?'+':'')+f1(s.change24)} / ${s.change7d==null?'–':(s.change7d>0?'+':'')+f1(s.change7d)} in</span></td><td data-label="SWE"><span>${f1(s.latest?.swe)} in</span></td><td data-label="Temp"><span>${s.latest?.temp==null?'–':Math.round(s.latest.temp)+'°F'}</span></td><td data-label="8 days"><span>${sparkBars(s.daily||[])}</span></td></tr>`).join('')}</tbody></table></div><p class="source">Measured by USDA NRCS SNOTEL stations (automated, mid-elevation sites, not resort snow stakes). Updated hourly by a scheduled job · data checked ${age<60?age+' min':Math.round(age/60)+' h'} ago. <a href="https://www.nrcs.usda.gov/wps/portal/wcc/home/snowClimateMonitoring/snowpack/" target="_blank" rel="noopener">NRCS snowpack ↗</a></p>`}
async function hourlyFor(p){const key=p.slice(0,2).join(',');let e=hourlyCache.get(key);if(e&&Date.now()-e.time<10*60000)return e.promise;const promise=(async()=>{const point=await pointMeta(p);return (await getJSON(point.forecastHourly)).properties})();hourlyCache.set(key,{time:Date.now(),promise});promise.catch(()=>hourlyCache.delete(key));return promise}
async function loadHourlyView(){const el=document.querySelector('#hourly-view');const r=RESORTS[hourlyResort],p=r.p[Math.min(hourlyPoint,r.p.length-1)];
 try{const [h,m]=await Promise.all([hourlyFor(p),mountainPoint(p)]);if(!el?.isConnected)return;
  const per=(m.forecast.periods||[]).slice(0,6);
  el.innerHTML=`<div class="chart-controls"><h3>${escapeHTML(r.name)} · ${escapeHTML(p[2])}</h3><div class="seg"><button data-hp="0" class="${hourlyPoint===0?'active':''}">Mid mountain</button><button data-hp="1" class="${hourlyPoint===1?'active':''}">Peak</button></div></div>${hourlyChart(h.periods||[],'America/Denver')}<div class="periods-list">${per.map(q=>`<div class="glance-period">${forecastIcon(q,'small')}<div><b>${escapeHTML(q.name)} · ${q.temperature}°</b><span>${escapeHTML(q.detailedForecast||q.shortForecast)}</span></div></div>`).join('')}</div><p class="source">NWS hourly and point forecast · updated ${new Date(h.updateTime).toLocaleString('en-US',{timeZone:'America/Denver'})} MT</p>`;
  el.querySelectorAll('[data-hp]').forEach(b=>b.onclick=()=>{hourlyPoint=+b.dataset.hp;loadHourlyView()})}
 catch{if(el?.isConnected)el.innerHTML='<div class="error">NWS forecast is temporarily unavailable.</div>'}}
async function loadMountainAlerts(){const el=document.querySelector('#alert-banner');try{const list=sortAlerts((await Promise.all(RESORTS.map(r=>alertsFor(r.p[0])))).flat());if(el?.isConnected)el.innerHTML=alertHTML(list)}catch{}}
function resortPills(sel,attr){return `<div class="day-pills" aria-label="Resort">${RESORTS.map((x,i)=>`<button ${attr}="${i}" class="${i===sel?'active':''}">${escapeHTML(x.name)}</button>`).join('')}</div>`}
function render(){document.querySelectorAll('nav [role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
 const head=`<div class="toolbar"><div><h2>Snow Report</h2><p class="sub">Wasatch resorts · NWS forecasts, global models and measured snowpack</p></div><div class="detail-actions"><a class="xlink" href="https://utahavalanchecenter.org/" target="_blank" rel="noopener">Avalanche forecast ↗</a><a class="xlink" href="../#radar/wasatch">Radar ›</a></div></div><div id="alert-banner"></div>`;
 if(tab==='resorts'){content.innerHTML=head+`<article class="card afd-card" id="resort-snow"><div class="state">Loading NWS snow grids for all resorts…</div></article>`;loadResortSnow()}
 else if(tab==='models'){content.innerHTML=head+`<article class="card afd-card" id="snow-models"><div class="state">Loading long-range snowfall models…</div></article>`;loadSnowModels()}
 else if(tab==='snowpack'){content.innerHTML=head+`<article class="card afd-card"><h3>Measured snowpack · SNOTEL</h3><p class="afd-intro">Automated snow depth and snow-water measurements near the resorts.</p><div id="snowpack">${snowpackHTML(snotel)}</div></article>`;loadSnotel().then(d=>{const el=document.querySelector('#snowpack');if(el)el.innerHTML=snowpackHTML(d)})}
 else{content.innerHTML=head+`<article class="card afd-card">${resortPills(hourlyResort,'data-hr')}<div id="hourly-view"><div class="state">Loading hourly forecast…</div></div></article>`;content.querySelectorAll('[data-hr]').forEach(b=>b.onclick=()=>{hourlyResort=+b.dataset.hr;render()});loadHourlyView()}
 loadMountainAlerts();const h=tab+(tab==='hourly'?'/'+slug(RESORTS[hourlyResort].name):'');if(location.hash.slice(1)!==h)history.replaceState(null,'','#'+h)}
function readHash(){const [t,a]=location.hash.slice(1).split('/');if(TABS[t])tab=t;if(t==='hourly'&&a){const i=RESORTS.findIndex(r=>slug(r.name)===a);if(i>=0)hourlyResort=i}}
window.addEventListener('hashchange',()=>{readHash();render()});
document.querySelectorAll('nav [role=tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});
function stamp(){const el=document.querySelector('#today');if(el)el.textContent=`${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',timeZone:'America/Denver'})} · updated ${ago(lastLoad)}`}
setInterval(()=>{if(document.visibilityState==='visible'&&Date.now()-lastLoad>15*60000){cache.clear();mountainCache.clear();alertCache.clear();hourlyCache.clear();snowModelCache.clear();lastLoad=Date.now();loadSnotel();render()}stamp()},60000);
// Ask AI context: current tab plus the other snow data already loaded
window.suiteContext=function(){const parts=[content.innerText.trim()];if(tab!=='snowpack'&&snotel?.stations)parts.push('SNOTEL measured snowpack:\n'+snotel.stations.map(s=>`${s.name} (${s.near}): depth ${f1(s.latest?.depth)} in, 24h change ${f1(s.change24)} in, 7-day change ${f1(s.change7d)} in, SWE ${f1(s.latest?.swe)} in`).join('\n'));
 return {app:'Snow Report',view:TABS[tab],text:parts.join('\n\n'),note:'Resort snow totals are NWS gridded forecasts; the model tab is independent global model guidance (GFS, ECMWF, AIFS, GraphCast); SNOTEL values are measured. Times are Mountain.'}};
readHash();render();loadSnotel();stamp();

</script></body></html>
