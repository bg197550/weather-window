<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Utah & West Storm Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #12161c; --panel: rgba(18,22,28,.94); --line: #2b333d; --text: #eef2f6; --muted: #9aa6b2;
    --accent: #3b9cff; --btn: #1f2630;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; background: #0b0e12; }
  .leaflet-container { background: #0b0e12; }

  header { position: absolute; top: 0; left: 0; right: 0; z-index: 1000; display: flex; align-items: center;
    gap: 12px; padding: 10px 14px; background: linear-gradient(#12161cf2, #12161c00); pointer-events: none; }
  header > * { pointer-events: auto; }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  header .region { margin-left: auto; display: flex; gap: 6px; }
  header .region a { white-space: nowrap; color: var(--text); text-decoration: none; font-size: 12px; padding: 5px 10px; border-radius: 999px;
    background: var(--btn); border: 1px solid var(--line); }
  header .region a.on { background: var(--accent); border-color: var(--accent); }
  header .back { color: var(--muted); text-decoration: none; font-size: 13px; }

  #stack { position: absolute; right: 12px; top: 60px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
  #stack button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: #f4f6f8; color: #111;
    display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 6px #0007; font-size: 20px; padding: 0; }
  #stack button.on { background: var(--accent); color: #fff; }
  #stack small { display: block; text-align: center; font-size: 10px; color: #fff; text-shadow: 0 1px 2px #000; margin-top: -4px; }
  #stack svg { width: 22px; height: 22px; }

  .sheet { position: absolute; right: 68px; z-index: 1001; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; width: 250px; display: none; box-shadow: 0 6px 24px #000a; }
  .sheet.open { display: block; }
  .sheet h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .sheet label { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; }
  .sheet .grp + .grp { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .sheet input[type=range] { width: 100%; }
  #layersSheet { top: 60px; }
  #opacitySheet { top: 170px; }

  #panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000; background: var(--panel);
    border-top: 1px solid var(--line); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  #panel .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #panel .name { font-weight: 700; font-size: 15px; }
  #panel .when { color: var(--muted); font-size: 13px; }
  #panel .status { margin-left: auto; color: var(--muted); font-size: 12px; }
  .controls { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .controls button { border: 0; background: transparent; color: var(--text); cursor: pointer; padding: 4px; display: grid; place-items: center; }
  .controls button.play { width: 38px; height: 38px; border-radius: 50%; background: #fff; color: #111; }
  .controls svg { width: 18px; height: 18px; }
  .track { position: relative; flex: 1; padding-bottom: 14px; }
  #slider { width: 100%; accent-color: var(--accent); margin: 0; }
  #ticks { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; font-size: 10px; color: var(--muted); }
  #ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  #ticks span::before { content: ""; position: absolute; left: 50%; top: -6px; width: 1px; height: 4px; background: var(--muted); }

  #legend { display: flex; margin: 10px -14px -10px; margin-bottom: calc(-10px - env(safe-area-inset-bottom)); }
  #legend div { flex: 1; text-align: center; font-size: 11px; font-weight: 600; padding: 4px 2px; color: #fff; text-shadow: 0 1px 1px #0009; }
  #legend.temp div { font-weight: 500; }

  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #1a2028; color: var(--text); }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; }
  .pop b { display: block; font-size: 14px; margin-bottom: 4px; }
  .pop .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; border: 1px solid #fff6; }
  .pop table { border-collapse: collapse; }
  .pop td { padding: 1px 8px 1px 0; }
  .pop td:first-child { color: var(--muted); }

  #loading { position: absolute; inset: 0; z-index: 999; display: grid; place-items: center; pointer-events: none; }
  #loading div { background: var(--panel); padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; }
  .leaflet-control-attribution { font-size: 10px; background: #0008 !important; color: #ccc; }
  .leaflet-control-attribution a { color: #ddd; }
  .leaflet-bottom { bottom: 120px; }

  @media (max-width: 600px) {
    header h1 { font-size: 14px; }
    header { flex-wrap: wrap; row-gap: 6px; }
    header .region { margin-left: 0; width: 100%; }
    #stack { top: 84px; }
    #layersSheet { top: 84px; } #opacitySheet { top: 190px; }
    header .back { display: none; }
    #panel .status { width: 100%; margin-left: 0; }
    #legend div { font-size: 9.5px; }
    .sheet { right: 64px; width: calc(100vw - 80px); max-width: 260px; }
  }
</style>

<body>
<div id="map"></div>

<header>
  <a class="back" href="index.html">&larr; Weather Window</a>
  <h1>Utah & West Storm Map</h1>
  <nav class="region">
    <a href="weather-map-west.html" class="on">Utah / West</a>
    <a href="weather-map-northeast.html" class="">Northeast</a>
  </nav>
</header>

<div id="stack">
  <div><button id="btnLocate" title="My location" aria-label="My location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button><small>Location</small></div>
  <div><button id="btnIn" title="Zoom in" aria-label="Zoom in">+</button></div>

  <div><button id="btnOpacity" title="Overlay opacity" aria-label="Opacity">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button><small>Opacity</small></div>
  <div><button id="btnLayers" class="on" title="Layers" aria-label="Layers">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/></svg></button><small>Layers</small></div>
</div>

<div class="sheet" id="layersSheet">
  <div class="grp">
    <h3>Overlay</h3>
    <label><input type="radio" name="layer" value="ptype" checked> Storm forecast (precip type)</label>
    <label><input type="radio" name="layer" value="temp"> Temperature forecast</label>

    <label><input type="radio" name="model" value="ecmwf_ifs" checked> ECMWF (9 km, 7 days)</label>
    <label><input type="radio" name="model" value="gfs_seamless"> GFS (7 days)</label>
    <label><input type="radio" name="model" value="ncep_nbm_conus"> NBM blend (7 days)</label>
    <label><input type="radio" name="model" value="ncep_hrrr_conus"> HRRR (3 km, 48 hrs)</label>
  </div>
  <div class="grp">
    <h3>Map</h3>

</div>

</div>

<div id="loading"><div>Loading forecast&hellip;</div></div>

<div id="panel">
  <div class="top">
    <span class="name" id="pname">Storm Forecast</span>
    <span class="when" id="when">&nbsp;</span>
    <span class="status" id="status"></span>
  </div>
  <div class="controls">
    <button class="play" id="btnPlay" aria-label="Play">
      <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button id="btnPrev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
    <button id="btnNext" aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    <div class="track"><input type="range" id="slider" min="0" max="0" value="0"><div id="ticks"></div></div>
  </div>
  <div id="legend"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ---------------- Region config ---------------- */
const CFG = {"id": "west", "title": "Utah & West Storm Map", "center": [40.4, -113.5], "zoom": 5, "tz": "America/Denver", "bbox": {"s": 31.5, "n": 49, "w": -125, "e": -102.5, "step": 1}};

/* ---------------- Constants ---------------- */
const MODELS = {
  ecmwf_ifs:        { label: 'ECMWF', days: 7 },
  gfs_seamless:     { label: 'GFS',   days: 7 },
  ncep_nbm_conus:   { label: 'NBM',   days: 7 },
  ncep_hrrr_conus:  { label: 'HRRR',  days: 2 },
};
// precip classes
const NONE = 0, RAIN = 1, SNOW = 2, MIX = 3, FZRA = 4;
const CLASS_NAME = { 1: 'Rain', 2: 'Snow', 3: 'Mix', 4: 'Freezing rain' };
const PTYPE_LEGEND = [
  ['Heavy Rain', '#d7301f'], ['Moderate Rain', '#e8c21a'], ['Rain', '#2e9e46'],
  ['Snow', '#2f78d6'], ['Heavy Snow', '#16308f'], ['Mix', '#8e4fc8'], ['Freezing Rain', '#e0479e'],
];
const TEMP_STOPS = [ // °F -> color
  [-20, [120, 40, 160]], [0, [70, 70, 200]], [15, [60, 140, 230]], [32, [235, 245, 255]],
  [33, [120, 210, 150]], [45, [80, 190, 80]], [60, [240, 210, 60]], [75, [240, 140, 40]], [95, [200, 40, 40]],
];
const CACHE_TTL = 90 * 60 * 1000;

/* ---------------- Map ---------------- */
const map = L.map('map', { zoomControl: false, attributionControl: true, minZoom: 3, maxZoom: 12, worldCopyJump: true })
  .setView(CFG.center, CFG.zoom);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 18, attribution: 'Imagery &copy; Esri &middot; Forecast <a href="https://open-meteo.com">Open-Meteo</a>',
}).addTo(map);
map.createPane('wx'); map.getPane('wx').style.zIndex = 420; map.getPane('wx').style.pointerEvents = 'none';
map.createPane('labels'); map.getPane('labels').style.zIndex = 460; map.getPane('labels').style.pointerEvents = 'none';
const labels = L.layerGroup([
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { pane: 'labels', maxZoom: 18 }),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { pane: 'labels', maxZoom: 18, opacity: .45, minZoom: 7 }),
]).addTo(map);

/* ---------------- State ---------------- */
const S = {
  layer: 'ptype', model: 'ecmwf_ifs', opacity: 0.8,
  grid: null,       // {lats, lons, nx, ny}
  data: null,       // {times[], cls[t][i], rate[t][i], snow[t][i], temp[t][i]}
  frame: 0, playing: null, frameImgs: {}, radar: null,
};
try { const m = localStorage.getItem('wxmap_model'); if (m && MODELS[m]) S.model = m; } catch (e) {}
try { const o = localStorage.getItem('wxmap_opacity'); if (o) S.opacity = +o; } catch (e) {}
document.querySelector(`input[name=model][value=${S.model}]`).checked = true;
document.getElementById('opacity').value = Math.round(S.opacity * 100);

/* ---------------- Grid & data ---------------- */
function buildGrid() {
  const { s, n, w, e, step } = CFG.bbox;
  const lats = [], lons = [];
  for (let la = s; la <= n + 1e-6; la += step) lats.push(+la.toFixed(3));
  for (let lo = w; lo <= e + 1e-6; lo += step) lons.push(+lo.toFixed(3));
  return { lats, lons, nx: lons.length, ny: lats.length };
}

async function fetchModel(model) {
  const key = `wxmap_${CFG.id}_${model}`;
  try {
    const c = JSON.parse(localStorage.getItem(key) || 'null');
    if (c && Date.now() - c.at < CACHE_TTL) return c.d;
  } catch (e) {}
  const g = S.grid, pts = [];
  for (let j = 0; j < g.ny; j++) for (let i = 0; i < g.nx; i++) pts.push([g.lats[j], g.lons[i]]);
  const CHUNK = 250, out = new Array(pts.length);
  const jobs = [];
  for (let k = 0; k < pts.length; k += CHUNK) {
    const part = pts.slice(k, k + CHUNK);
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + part.map(p => p[0]).join(',') +
      '&longitude=' + part.map(p => p[1]).join(',') +
      '&hourly=precipitation,snowfall,weather_code,temperature_2m&models=' + model +
      '&forecast_days=' + MODELS[model].days + '&timeformat=unixtime&temperature_unit=fahrenheit';
    jobs.push(fetch(url).then(r => r.json()).then(d => {
      if (d.error) throw new Error(d.reason);
      (Array.isArray(d) ? d : [d]).forEach((x, q) => out[k + q] = x.hourly);
    }));
  }
  await Promise.all(jobs);

  // compact & classify
  const nowH = Math.floor(Date.now() / 3600000) * 3600;
  const allT = out[0].time;
  const keep = [];
  allT.forEach((t, ti) => {
    if (t < nowH) return;
    if (out.some(h => h.precipitation[ti] !== null)) keep.push(ti);
  });
  const d = { times: keep.map(ti => allT[ti]), cls: [], rate: [], snow: [], temp: [] };
  for (const ti of keep) {
    const cls = [], rate = [], snow = [], temp = [];
    for (const h of out) {
      const p = h.precipitation[ti] || 0, sn = h.snowfall[ti] || 0, wc = h.weather_code[ti];
      const T = h.temperature_2m[ti];
      let c = NONE;
      if (p >= 0.05) {
        const swe = sn * 10 / 7, frac = p > 0 ? Math.min(1, swe / p) : 0;
        if (wc === 56 || wc === 57 || wc === 66 || wc === 67) c = FZRA;
        else if (frac >= 0.7) c = SNOW;
        else if (frac > 0.25) c = MIX;
        else c = RAIN;
      }
      cls.push(c); rate.push(+p.toFixed(2)); snow.push(+sn.toFixed(2)); temp.push(T === null ? null : Math.round(T));
    }
    d.cls.push(cls); d.rate.push(rate); d.snow.push(snow); d.temp.push(temp);
  }
  try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), d })); } catch (e) {
    try { Object.keys(localStorage).filter(k => k.startsWith('wxmap_') && k !== key && k.split('_').length > 2 && !k.endsWith('model') && !k.endsWith('opacity')).forEach(k => localStorage.removeItem(k));
          localStorage.setItem(key, JSON.stringify({ at: Date.now(), d })); } catch (e2) {}
  }
  return d;
}

/* ---------------- Rendering ---------------- */
const F = 8; // upsample factor
function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
const C_RAIN_L = hex('#2e9e46'), C_RAIN_M = hex('#e8c21a'), C_RAIN_H = hex('#d7301f');
const C_SNOW_L = hex('#9cd0ff'), C_SNOW_M = hex('#2f78d6'), C_SNOW_H = hex('#16308f');
const C_MIX = hex('#8e4fc8'), C_FZ = hex('#e0479e');
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function ptypeColor(c, p) { // p = mm/h liquid
  if (c === RAIN) {
    if (p < 1) return C_RAIN_L;
    if (p < 2.5) return lerp(C_RAIN_L, C_RAIN_M, (p - 1) / 1.5);
    if (p < 5) return lerp(C_RAIN_M, C_RAIN_H, (p - 2.5) / 2.5);
    return C_RAIN_H;
  }
  if (c === SNOW) {
    if (p < 0.6) return lerp(C_SNOW_L, C_SNOW_M, p / 0.6);
    return lerp(C_SNOW_M, C_SNOW_H, clamp((p - 0.6) / 1.4, 0, 1));
  }
  return c === MIX ? C_MIX : C_FZ;
}
function tempColor(T) {
  if (T <= TEMP_STOPS[0][0]) return TEMP_STOPS[0][1];
  for (let k = 1; k < TEMP_STOPS.length; k++) {
    if (T <= TEMP_STOPS[k][0]) {
      const [t0, c0] = TEMP_STOPS[k - 1], [t1, c1] = TEMP_STOPS[k];
      return lerp(c0, c1, (T - t0) / (t1 - t0));
    }
  }
  return TEMP_STOPS[TEMP_STOPS.length - 1][1];
}

// Bilinear sampling helper over a flat field (row j = lat index from south)
function sampler(field, g) {
  return (fx, fy) => {
    const i0 = Math.floor(fx), j0 = Math.floor(fy), i1 = Math.min(i0 + 1, g.nx - 1), j1 = Math.min(j0 + 1, g.ny - 1);
    const tx = fx - i0, ty = fy - j0;
    const a = field[j0 * g.nx + i0], b = field[j0 * g.nx + i1], c = field[j1 * g.nx + i0], d = field[j1 * g.nx + i1];
    return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
  };
}

function frameImage(t) {
  const key = S.layer + ':' + t;
  if (S.frameImgs[key]) return S.frameImgs[key];
  const g = S.grid, W = (g.nx - 1) * F + 1, H = (g.ny - 1) * F + 1;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(W, H), px = img.data;
  // rows are spaced evenly in Web Mercator y so one drawImage lines up with the basemap
  const merc = la => Math.log(Math.tan(Math.PI / 4 + la * Math.PI / 360));
  const mN = merc(g.lats[g.ny - 1]), mS = merc(g.lats[0]);
  const rowFy = new Float32Array(H);
  for (let y = 0; y < H; y++) {
    const m = mN + (mS - mN) * (y / (H - 1));
    const lat = (2 * Math.atan(Math.exp(m)) - Math.PI / 2) * 180 / Math.PI;
    rowFy[y] = clamp((lat - g.lats[0]) / CFG.bbox.step, 0, g.ny - 1);
  }
  if (S.layer === 'ptype') {
    const cls = S.data.cls[t], rate = S.data.rate[t];
    // per-class intensity fields so boundaries blend smoothly
    const fields = [RAIN, SNOW, MIX, FZRA].map(c => sampler(cls.map((k, i) => k === c ? Math.max(rate[i], 0.05) : 0), g));
    for (let y = 0; y < H; y++) {
      const fy = rowFy[y];
      for (let x = 0; x < W; x++) {
        const fx = x / F;
        let best = 0, bc = 0;
        for (let k = 0; k < 4; k++) { const v = fields[k](fx, fy); if (v > best) { best = v; bc = k + 1; } }
        if (best < 0.035) continue;
        const col = ptypeColor(bc, best), o = (y * W + x) * 4;
        px[o] = col[0]; px[o + 1] = col[1]; px[o + 2] = col[2];
        px[o + 3] = Math.round(255 * clamp(0.45 + best * 0.35, 0.45, 0.95) * clamp((best - 0.035) / 0.05, 0, 1));
      }
    }
  } else {
    const temp = S.data.temp[t].map(v => v === null ? 32 : v), f = sampler(temp, g);
    for (let y = 0; y < H; y++) {
      const fy = rowFy[y];
      for (let x = 0; x < W; x++) {
        const col = tempColor(f(x / F, fy)), o = (y * W + x) * 4;
        px[o] = col[0]; px[o + 1] = col[1]; px[o + 2] = col[2]; px[o + 3] = 170;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
  return (S.frameImgs[key] = cv);
}

const WxLayer = L.Layer.extend({
  onAdd(m) {
    this._c = L.DomUtil.create('canvas', 'leaflet-zoom-hide');
    m.getPane('wx').appendChild(this._c);
    m.on('moveend zoomend resize', this.redraw, this);
    this.redraw();
  },
  onRemove(m) { this._c.remove(); m.off('moveend zoomend resize', this.redraw, this); },
  redraw() {
    const m = this._map, c = this._c; if (!m || !c) return;
    const size = m.getSize(), dpr = window.devicePixelRatio || 1;
    c.width = size.x * dpr; c.height = size.y * dpr; c.style.width = size.x + 'px'; c.style.height = size.y + 'px';
    L.DomUtil.setPosition(c, m.containerPointToLayerPoint([0, 0]));
    c.style.opacity = S.opacity;
    const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, size.x, size.y);
    if (!S.data || S.layer === 'radar') return;
    const img = frameImage(S.frame), g = S.grid;
    const p0 = m.latLngToContainerPoint([g.lats[g.ny - 1], g.lons[0]]), p1 = m.latLngToContainerPoint([g.lats[0], g.lons[g.nx - 1]]);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, p0.x, p0.y, p1.x - p0.x, p1.y - p0.y);
  },
});
const wx = new WxLayer().addTo(map);

/* ---------------- Radar (RainViewer) ---------------- */
async function loadRadar() {
  if (S.radar) return S.radar;
  const j = await fetch('https://api.rainviewer.com/public/weather-maps.json').then(r => r.json());
  const frames = [...(j.radar.past || []), ...(j.radar.nowcast || [])];
  const layers = frames.map(f => L.tileLayer(`${j.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`, {
    pane: 'wx', opacity: 0, maxNativeZoom: 7, maxZoom: 12, attribution: 'Radar <a href="https://rainviewer.com">RainViewer</a>',
  }));
  return (S.radar = { times: frames.map(f => f.time), layers });
}
function showRadarFrame(t) {
  S.radar.layers.forEach((l, k) => {
    if (Math.abs(k - t) <= 1 && !map.hasLayer(l)) l.addTo(map); // preload neighbours
    if (map.hasLayer(l)) l.setOpacity(k === t ? S.opacity : 0);
  });
}
function hideRadar() { if (S.radar) S.radar.layers.forEach(l => map.removeLayer(l)); }

/* ---------------- Timeline UI ---------------- */
const $ = id => document.getElementById(id);
const fmtWhen = new Intl.DateTimeFormat('en-US', { timeZone: CFG.tz, weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
const fmtDay = new Intl.DateTimeFormat('en-US', { timeZone: CFG.tz, weekday: 'short' });
const fmtHour = new Intl.DateTimeFormat('en-US', { timeZone: CFG.tz, hour: 'numeric', hour12: false });
function times() { return S.layer === 'radar' ? (S.radar ? S.radar.times : []) : (S.data ? S.data.times : []); }

function setFrame(t) {
  const T = times(); if (!T.length) return;
  S.frame = clamp(t, 0, T.length - 1);
  $('slider').value = S.frame;
  const parts = fmtWhen.formatToParts(new Date(T[S.frame] * 1000));
  const get = k => (parts.find(p => p.type === k) || {}).value || '';
  $('when').textContent = `${get('weekday')} ${get('month')} ${get('day')} at ${get('hour')}:${get('minute')} ${get('dayPeriod').toLowerCase()} ${get('timeZoneName')}`;
  if (S.layer === 'radar') showRadarFrame(S.frame); else wx.redraw();
  if (popup.isOpen()) updatePopup();
}

function buildTicks() {
  const T = times(), el = $('ticks'); el.innerHTML = '';
  if (T.length < 2 || S.layer === 'radar') return;
  T.forEach((t, k) => {
    const d = new Date(t * 1000);
    if (k > 0 && fmtHour.format(d) % 24 === 0) {
      const s = document.createElement('span'); s.textContent = fmtDay.format(d);
      s.style.left = (k / (T.length - 1) * 100) + '%'; el.appendChild(s);
    }
  });
}

function play(on) {
  clearInterval(S.playing); S.playing = null;
  $('icoPlay').style.display = on ? 'none' : ''; $('icoPause').style.display = on ? '' : 'none';
  if (!on) return;
  const ms = S.layer === 'radar' ? 450 : 160;
  S.playing = setInterval(() => {
    const n = times().length; if (!n) return;
    setFrame(S.frame + 1 >= n ? 0 : S.frame + 1);
  }, ms);
}
$('btnPlay').onclick = () => play(!S.playing);
$('btnPrev').onclick = () => { play(false); setFrame(S.frame - 1); };
$('btnNext').onclick = () => { play(false); setFrame(S.frame + 1); };
$('slider').oninput = e => { play(false); setFrame(+e.target.value); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'radio') return;
  if (e.key === 'ArrowRight') { play(false); setFrame(S.frame + 1); }
  else if (e.key === 'ArrowLeft') { play(false); setFrame(S.frame - 1); }
  else if (e.key === ' ') { e.preventDefault(); play(!S.playing); }
});

function setLegend() {
  const el = $('legend'); el.className = S.layer === 'temp' ? 'temp' : '';
  if (S.layer === 'temp') {
    el.innerHTML = [-10, 5, 20, 32, 40, 50, 65, 80, 95].map(t => {
      const c = tempColor(t); const dark = (c[0] * .3 + c[1] * .59 + c[2] * .11) > 170;
      return `<div style="background:rgb(${c.map(Math.round)});${dark ? 'color:#111;text-shadow:none' : ''}">${t}°</div>`;
    }).join('');
  } else if (S.layer === 'radar') {
    el.innerHTML = [['Light', '#88ddee'], ['Moderate', '#0099cc'], ['Heavy', '#ffaa00'], ['Intense', '#ff4400'], ['Snow', '#b8b8ff']]
      .map(([n, c]) => `<div style="background:${c}">${n}</div>`).join('');
  } else {
    el.innerHTML = PTYPE_LEGEND.map(([n, c]) => `<div style="background:${c}">${n}</div>`).join('');
  }
}

function setTitle() {
  const m = MODELS[S.model].label;
  $('pname').textContent = S.layer === 'radar' ? 'Live Radar' : S.layer === 'temp' ? `Temperature Forecast · ${m}` : `Storm Forecast · ${m}`;
  $('modelGrp').style.opacity = S.layer === 'radar' ? .4 : 1;
}

/* ---------------- Click readout ---------------- */
const popup = L.popup({ maxWidth: 240 });
let popLL = null;
function nearestIdx(ll) {
  const g = S.grid, st = CFG.bbox.step;
  const i = Math.round((ll.lng - g.lons[0]) / st), j = Math.round((ll.lat - g.lats[0]) / st);
  if (i < 0 || j < 0 || i >= g.nx || j >= g.ny) return -1;
  return j * g.nx + i;
}
function updatePopup() {
  if (!popLL || !S.data) return;
  if (S.layer === 'radar') { popup.setContent('<div class="pop">Readouts are available on the forecast layers.</div>'); return; }
  const idx = nearestIdx(popLL);
  if (idx < 0) { popup.setContent('<div class="pop">Outside the forecast area.</div>'); return; }
  const t = S.frame, c = S.data.cls[t][idx], p = S.data.rate[t][idx], sn = S.data.snow[t][idx], T = S.data.temp[t][idx];
  // storm totals from now through this frame
  let totP = 0, totS = 0;
  for (let k = 0; k <= t; k++) { totP += S.data.rate[k][idx]; totS += S.data.snow[k][idx]; }
  const col = c ? `rgb(${ptypeColor(c, p).map(Math.round)})` : 'transparent';
  popup.setContent(`<div class="pop"><b>${c ? `<span class="sw" style="background:${col}"></span>${CLASS_NAME[c]}` : 'No precipitation'}</b>
    <table>
      <tr><td>Temperature</td><td>${T === null ? '–' : T + '°F'}</td></tr>
      <tr><td>Precip this hour</td><td>${(p / 25.4).toFixed(2)}"</td></tr>
      <tr><td>Snow this hour</td><td>${(sn / 2.54).toFixed(1)}"</td></tr>
      <tr><td>Total precip to here</td><td>${(totP / 25.4).toFixed(2)}"</td></tr>
      <tr><td>Total snow to here</td><td>${(totS / 2.54).toFixed(1)}"</td></tr>
    </table></div>`);
}
map.on('click', e => { popLL = e.latlng; popup.setLatLng(e.latlng).openOn(map); updatePopup(); });

/* ---------------- Controls ---------------- */
$('btnIn').onclick = () => map.zoomIn();
$('btnOut').onclick = () => map.zoomOut();
let locMarker = null;
$('btnLocate').onclick = () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (locMarker) locMarker.setLatLng(ll);
    else locMarker = L.circleMarker(ll, { radius: 7, color: '#fff', weight: 2, fillColor: '#3b9cff', fillOpacity: 1 }).addTo(map);
    map.setView(ll, Math.max(map.getZoom(), 8));
  }, () => { $('status').textContent = 'Location unavailable'; });
};
function toggleSheet(id, btn) {
  const el = $(id), open = !el.classList.contains('open');
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open'));
  if (open) el.classList.add('open');
}
$('btnLayers').onclick = () => toggleSheet('layersSheet');
$('btnOpacity').onclick = () => toggleSheet('opacitySheet');
map.on('click', () => document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open')));
$('opacity').oninput = e => {
  S.opacity = e.target.value / 100;
  try { localStorage.setItem('wxmap_opacity', S.opacity); } catch (err) {}
  if (S.layer === 'radar') showRadarFrame(S.frame); else wx.redraw();
};
$('chkLabels').onchange = e => e.target.checked ? labels.addTo(map) : map.removeLayer(labels);

document.querySelectorAll('input[name=layer]').forEach(r => r.onchange = async () => {
  play(false); S.layer = r.value; setTitle(); setLegend();
  if (S.layer === 'radar') {
    $('loading').style.display = '';
    try { await loadRadar(); } catch (e) { $('status').textContent = 'Radar unavailable'; }
    $('loading').style.display = 'none';
    $('slider').max = times().length - 1; buildTicks(); wx.redraw(); setFrame(times().length - 1);
    $('status').textContent = 'RainViewer composite';
  } else {
    hideRadar(); $('slider').max = times().length - 1; buildTicks();
    setFrame(Math.min(S.frame, times().length - 1)); setStatus();
  }
});
document.querySelectorAll('input[name=model]').forEach(r => r.onchange = () => {
  S.model = r.value; try { localStorage.setItem('wxmap_model', S.model); } catch (e) {}
  if (S.layer === 'radar') { document.querySelector('input[name=layer][value=ptype]').click(); }
  load();
});

function setStatus() {
  if (!S.data) return;
  $('status').textContent = `${MODELS[S.model].label} · ${S.data.times.length} hrs · updated ${new Date(S.loadedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
}

/* ---------------- Boot ---------------- */
async function load() {
  play(false); setTitle();
  $('loading').style.display = ''; $('loading').firstElementChild.textContent = `Loading ${MODELS[S.model].label} forecast…`;
  try {
    S.data = await fetchModel(S.model); S.loadedAt = Date.now(); S.frameImgs = {};
    $('slider').max = S.data.times.length - 1; buildTicks(); setStatus(); setFrame(0);
    $('loading').style.display = 'none';
  } catch (e) {
    console.error(e);
    $('loading').firstElementChild.textContent = 'Forecast failed to load — ' + (e.message || 'network error');
  }
}
S.grid = buildGrid(); setLegend(); load();
</script>
</body>
</html>
